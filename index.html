<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stage</title>
</head>

<body>
  <div id="root"></div>
  <script>
    window.onerror = function (msg, url, line, col, err) {
      document.getElementById('root').innerHTML =
        '<div style="padding:20px;color:#ff4444;font-family:monospace;background:#111;min-height:100vh;">' +
        '<h2>Runtime Error</h2><pre>' + msg + '\n' + (err && err.stack || '') + '</pre></div>';
    };
    window.addEventListener('unhandledrejection', function (e) {
      document.getElementById('root').innerHTML =
        '<div style="padding:20px;color:#ff4444;font-family:monospace;background:#111;min-height:100vh;">' +
        '<h2>Unhandled Promise Rejection</h2><pre>' + (e.reason && e.reason.stack || e.reason || 'unknown') + '</pre></div>';
    });
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
